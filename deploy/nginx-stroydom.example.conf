# Nginx reverse proxy example for СТРОЙДОМ
# Install as: /etc/nginx/sites-available/stroydom
# Then: ln -s /etc/nginx/sites-available/stroydom /etc/nginx/sites-enabled/
#
# ЗАМЕНИТЬ example.com на реальный домен перед применением.
# HTTPS-блок ниже дописывает certbot --nginx автоматически.

server {
    listen 80;
    listen [::]:80;

    # ЗАМЕНИТЬ на реальный домен
    server_name example.com www.example.com;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    client_max_body_size 2m;

    # Do not let search engines index the CRM even if it is linked somewhere
    location /leads {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite, not append: the client must not be able to inject an IP
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Both headers feed the application rate limiter. They are overwritten
        # here (not appended), so a client cannot spoof its address by sending
        # its own X-Forwarded-For. With an extra trusted proxy in front
        # (e.g. Cloudflare) switch to ngx_http_realip_module instead.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }
}
